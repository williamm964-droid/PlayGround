<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e7">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23315d4c'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='42' fill='white'%3E%E2%9C%B3%3C/text%3E%3C/svg%3E">
  <title>Mix & Match — Cozinha em jogo</title>
  <style>
*{box-sizing:border-box} :root{--ink:#203b34;--muted:#75847b;--cream:#f6f1e7;--paper:#fffdf8;--green:#315d4c;--orange:#e8784b;--line:#e6e1d6;--yellow:#f2c65d} body{margin:0;background:var(--cream);color:var(--ink);font-family:ui-rounded,"Avenir Next",Avenir,system-ui,sans-serif;min-height:100vh}button{font:inherit;color:inherit} .site{min-height:100vh;max-width:1440px;margin:auto;padding:20px clamp(16px,4vw,56px) 26px;display:flex;flex-direction:column}.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:26px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:-.04em;font-size:19px}.brandmark{width:32px;height:32px;border-radius:11px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:17px}.brand span:last-child{color:#7a877d;font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:800}.topright{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}.layout{flex:1;display:grid;grid-template-columns:minmax(400px,1.15fr) minmax(320px,.85fr);gap:clamp(28px,6vw,88px);align-items:center;max-width:1130px;width:100%;margin:0 auto}.game-column{width:100%;max-width:570px;margin:auto}.eyebrow{font-size:11px;color:var(--orange);font-weight:900;letter-spacing:.18em;text-transform:uppercase;margin-bottom:8px}.heading{font-family:Georgia,serif;font-size:clamp(27px,4vw,42px);line-height:1.04;letter-spacing:-.045em;margin:0 0 7px}.subtitle{font-size:13px;color:var(--muted);margin:0 0 20px}.scorebar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:10px 13px}.stat label{display:block;color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;margin-bottom:4px}.stat strong{font-size:19px;letter-spacing:-.04em}.board-shell{padding:9px;background:#d9e2d6;border:1px solid #c9d5c9;border-radius:19px;box-shadow:0 7px 0 #c6d2c5,0 16px 35px #304f3810;position:relative}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;touch-action:manipulation;user-select:none}.tile{appearance:none;border:0;border-radius:11px;aspect-ratio:1;display:grid;place-items:center;font-size:clamp(21px,4vw,37px);line-height:1;background:var(--paper);box-shadow:0 3px 0 #d9d4c9,inset 0 1px #fff;cursor:pointer;transition:transform .13s,filter .15s,background .15s;position:relative;padding:0}.tile:hover{transform:translateY(-2px);filter:brightness(1.03)}.tile.selected{transform:scale(.88);background:#f8d875;box-shadow:0 0 0 3px var(--orange),0 3px 0 #d9b84f}.tile.matched{animation:pop .25s ease forwards}.tile:focus-visible,.button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}.tile[data-special="1"]:after{content:"✦";position:absolute;right:4px;top:3px;font-size:10px;color:var(--orange)}@keyframes pop{to{transform:scale(.2);opacity:0}}.board-footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;font-weight:700;padding:11px 3px 0}.board-footer span:first-child{color:var(--green)}.side{max-width:360px}.side-kicker{font-size:11px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}.side h2{font-family:Georgia,serif;font-size:clamp(34px,4.6vw,54px);line-height:.98;letter-spacing:-.055em;margin:0 0 17px}.side h2 em{font-weight:400;color:var(--orange)}.copy{color:#65756d;font-size:14px;line-height:1.65;max-width:320px}.goal-card{margin:25px 0 16px;background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:17px 18px}.goal-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800}.goal-top strong{font-size:14px}.progress{height:8px;border-radius:9px;background:#eeeae0;margin-top:12px;overflow:hidden}.progress i{height:100%;display:block;width:0;background:var(--green);border-radius:9px;transition:width .3s}.goal-note{font-size:11px;color:var(--muted);margin-top:9px}.button{border:0;border-radius:13px;background:var(--green);color:white;font-weight:850;font-size:14px;padding:15px 20px;width:100%;cursor:pointer;box-shadow:0 4px 0 #234335;transition:transform .12s,background .2s}.button:hover{background:#244c3c;transform:translateY(-1px)}.button:active{transform:translateY(2px);box-shadow:0 2px 0 #234335}.hint{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;display:flex;gap:11px;font-size:12px;line-height:1.55;color:var(--muted)}.hint b{font-size:18px;color:var(--orange)}.message{position:absolute;inset:0;display:grid;place-items:center;background:#203b34b8;border-radius:18px;z-index:2;backdrop-filter:blur(4px)}.message-card{background:var(--paper);border-radius:19px;padding:28px 30px;text-align:center;max-width:300px;box-shadow:0 12px 40px #0003}.message-card .emoji{font-size:44px}.message-card h3{font-family:Georgia,serif;font-size:28px;margin:6px 0}.message-card p{color:var(--muted);font-size:13px;line-height:1.55}.message-card .button{margin-top:8px}.hidden{display:none!important}.footer{border-top:1px solid var(--line);margin-top:26px;padding-top:13px;color:#8b958c;font-size:10px;display:flex;justify-content:space-between;letter-spacing:.04em}.footer b{color:var(--green)}@media(max-width:800px){.site{padding:12px 16px 18px}.topbar{margin-bottom:18px}.layout{grid-template-columns:1fr;gap:25px;align-items:start;max-width:510px}.game-column{max-width:510px}.side{max-width:510px;display:grid;grid-template-columns:1fr 1fr;column-gap:18px;align-items:start}.side-kicker,.side h2,.copy{grid-column:1/-1}.side h2{font-size:38px;margin-bottom:10px}.copy{margin:0}.goal-card{margin:16px 0 12px;grid-column:1/-1}.button{grid-column:1/-1}.hint{grid-column:1/-1;margin-top:14px}.footer{margin-top:24px}.tile{font-size:clamp(22px,6.6vw,37px);border-radius:9px}.board{gap:4px}.board-shell{padding:7px}.scorebar{gap:6px}.stat{padding:9px 10px}.stat strong{font-size:17px}}
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
const tools=[{icon:'🥄',name:'spoon'},{icon:'🍴',name:'fork'},{icon:'🔪',name:'knife'},{icon:'🥣',name:'bowl'},{icon:'🧂',name:'salt shaker'},{icon:'🧽',name:'sponge'}];
const SIZE=8, GOAL=1200, START_MOVES=25;
let board=[], selected=-1, score=0, moves=START_MOVES, busy=false, combo=0;
const root=document.getElementById('app');
root.innerHTML=`<div class="site"><header class="topbar"><div class="brand"><div class="brandmark">✳</div><div>mix & match<br><span>kitchen club</span></div></div><div class="topright">Açúcar? Hoje não.</div></header><main class="layout"><section class="game-column"><div class="eyebrow">Desafio da bancada · 01</div><h1 class="heading">Organize a bagunça.</h1><p class="subtitle">Combine utensílios iguais e deixe a cozinha brilhando.</p><div class="scorebar"><div class="stat"><label>Pontuação</label><strong id="score">0</strong></div><div class="stat"><label>Objetivo</label><strong>${GOAL.toLocaleString('pt-BR')}</strong></div><div class="stat"><label>Jogadas</label><strong id="moves">${START_MOVES}</strong></div></div><div class="board-shell"><div class="board" id="board" role="grid" aria-label="Tabuleiro de utensílios"></div><div class="message hidden" id="message"><div class="message-card"><div class="emoji" id="resultEmoji">✨</div><h3 id="resultTitle">Mandou bem!</h3><p id="resultCopy"></p><button class="button" id="playAgain">Jogar de novo</button></div></div></div><div class="board-footer"><span>✦ Combos rendem pontos extras</span><span id="status">Sua vez de combinar</span></div></section><aside class="side"><div class="side-kicker">Uma pausa gostosa</div><h2>Doce jogo.<br><em>Zero doces.</em></h2><p class="copy">Talheres, tigelas e esponjas tomaram conta da bancada. Faça trincas para arrumar tudo — com um pouquinho de estratégia.</p><div class="goal-card"><div class="goal-top"><span>Meta da rodada</span><strong>⭐ <span id="goalScore">0</span> / ${GOAL.toLocaleString('pt-BR')}</strong></div><div class="progress"><i id="progress"></i></div><div class="goal-note">Dica: sequências maiores valem mais pontos.</div></div><button class="button" id="newGame">↻ &nbsp; Nova rodada</button><div class="hint"><b>↔</b><span>Toque em dois utensílios vizinhos para trocar. Forme uma linha de 3 ou mais iguais!</span></div></aside></main><footer class="footer"><span>FEITO PARA UMA COZINHA MAIS DIVERTIDA</span><span><b>mix & match</b> · edição utensílios</span></footer></div>`;
const boardEl=document.getElementById('board');
const rand=()=>Math.floor(Math.random()*tools.length);
function newBoard(){board=Array.from({length:SIZE*SIZE},(_,i)=>{let v;do{v=rand()}while((i%SIZE>1&&board[i-1]===v&&board[i-2]===v)||(i>=2*SIZE&&board[i-SIZE]===v&&board[i-2*SIZE]===v));return v;});score=0;moves=START_MOVES;selected=-1;combo=0;update();}
function update(){document.getElementById('score').textContent=score.toLocaleString('pt-BR');document.getElementById('goalScore').textContent=score.toLocaleString('pt-BR');document.getElementById('moves').textContent=moves;document.getElementById('progress').style.width=Math.min(100,score/GOAL*100)+'%';render();}
function render(){boardEl.innerHTML='';board.forEach((v,i)=>{const b=document.createElement('button');b.className='tile'+(i===selected?' selected':'');b.type='button';b.setAttribute('role','gridcell');b.setAttribute('aria-label',`${tools[v].name}, linha ${Math.floor(i/SIZE)+1}, coluna ${i%SIZE+1}`);b.textContent=tools[v].icon;b.dataset.index=i;b.addEventListener('click',()=>choose(i));boardEl.appendChild(b);});}
function choose(i){if(busy)return;if(selected<0){selected=i;render();return;}if(i===selected){selected=-1;render();return;}const near=Math.abs(i-selected)===SIZE||(Math.floor(i/SIZE)===Math.floor(selected/SIZE)&&Math.abs(i-selected)===1);if(!near){selected=i;render();return;}const a=selected,b=i;selected=-1;[board[a],board[b]]=[board[b],board[a]];const found=findMatches();if(!found.length){[board[a],board[b]]=[board[b],board[a]];render();document.getElementById('status').textContent='Essa troca não forma uma trinca';setTimeout(()=>{if(!busy)document.getElementById('status').textContent='Sua vez de combinar';},1200);return;}moves--;combo=0;resolve(found);}
function findMatches(){const set=new Set();for(let r=0;r<SIZE;r++){let c=0;while(c<SIZE){let e=c+1;while(e<SIZE&&board[r*SIZE+e]===board[r*SIZE+c])e++;if(e-c>=3)for(let k=c;k<e;k++)set.add(r*SIZE+k);c=e;}}for(let c=0;c<SIZE;c++){let r=0;while(r<SIZE){let e=r+1;while(e<SIZE&&board[e*SIZE+c]===board[r*SIZE+c])e++;if(e-r>=3)for(let k=r;k<e;k++)set.add(k*SIZE+c);r=e;}}return [...set];}
function resolve(matches){if(!matches.length){busy=false;update();checkEnd();return;}busy=true;combo++;document.getElementById('status').textContent=combo>1?`Combo x${combo}!`:'Boa combinação!';matches.forEach(i=>{const el=boardEl.children[i];if(el)el.classList.add('matched');});score+=matches.length*60+(combo-1)*100;setTimeout(()=>{matches.forEach(i=>board[i]=-1);for(let c=0;c<SIZE;c++){let write=SIZE-1;for(let r=SIZE-1;r>=0;r--){const i=r*SIZE+c;if(board[i]!==-1){board[write*SIZE+c]=board[i];write--;}}while(write>=0)board[write--*SIZE+c]=rand();}render();setTimeout(()=>resolve(findMatches()),160);},240);}
function checkEnd(){if(score>=GOAL){endGame(true);}else if(moves<=0){endGame(false);}else{document.getElementById('status').textContent='Sua vez de combinar';}}
function endGame(win){document.getElementById('resultEmoji').textContent=win?'🏆':'🧺';document.getElementById('resultTitle').textContent=win?'Bancada brilhando!':'Rodada encerrada';document.getElementById('resultCopy').textContent=win?`Você fez ${score.toLocaleString('pt-BR')} pontos e deixou tudo em ordem. Que talento!`:`Você marcou ${score.toLocaleString('pt-BR')} pontos. Mais uma rodada e essa cozinha fica impecável!`;document.getElementById('message').classList.remove('hidden');}
document.getElementById('newGame').addEventListener('click',()=>{document.getElementById('message').classList.add('hidden');newBoard();});document.getElementById('playAgain').addEventListener('click',()=>{document.getElementById('message').classList.add('hidden');newBoard();});newBoard();
  </script>
</body>
</html>
